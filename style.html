<style>
/* ═══════════════ TOKENS ═══════════════ */
:root{
  --ink:#07080A; --ink2:#0C0E12; --ink3:#12151A;
  --glass:rgba(22,26,32,.66); --glass2:rgba(30,35,42,.55);
  --line:#252B34; --line2:#333B46;
  --silver:#E6EAEF; --silver2:#AFB7C2; --dim:#727A86;
  --blue:#2F6FEB; --blue2:#5C8EF6; --blueGlow:rgba(47,111,235,.30);
  --pend:#CBA33A; --anal:#5C8EF6; --apro:#33A96E; --nao:#C4574F;
  --r:14px; --r-sm:9px;
  --sh:0 18px 44px -20px rgba(0,0,0,.85);
  --dsp:'Chakra Petch',system-ui,sans-serif;
  --bdy:'IBM Plex Sans',system-ui,sans-serif;
  --mno:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  min-height:100vh;font-family:var(--bdy);color:var(--silver);background:var(--ink);
  background-image:
    radial-gradient(1100px 520px at 12% -12%, rgba(47,111,235,.13), transparent 62%),
    radial-gradient(900px 480px at 92% 0%, rgba(190,200,215,.07), transparent 60%),
    linear-gradient(180deg,#07080A 0%,#0A0C10 48%,#07080A 100%);
  background-attachment:fixed;line-height:1.55;
}
/* textura discreta de varredura — referência ao monitoramento */
.scanlines{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.018) 0 1px,transparent 1px 4px)}
.hidden{display:none !important}
::selection{background:var(--blueGlow);color:#fff}
:focus-visible{outline:2px solid var(--blue2);outline-offset:2px;border-radius:4px}

/* ═══════════════ TIPOGRAFIA ═══════════════ */
.display{font-family:var(--dsp);font-weight:700;letter-spacing:.055em;text-transform:uppercase;
  line-height:1.06;font-size:clamp(1.7rem,4.4vw,3.15rem);color:#fff}
.display em{font-style:normal;color:var(--silver2);
  background:linear-gradient(90deg,#EFF2F6,#9AA3AF 88%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.display.sm{font-size:clamp(1.05rem,2.1vw,1.4rem);letter-spacing:.09em}
.eyebrow{font-family:var(--mno);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--dim);display:flex;align-items:center;gap:.55rem;flex-wrap:wrap}
.eyebrow b{color:var(--silver2);font-weight:500}
.dot{width:6px;height:6px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px var(--blueGlow);
  animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(47,111,235,.06)}}
.lede{color:var(--silver2);max-width:62ch;font-size:1rem}
.mono{font-family:var(--mno);letter-spacing:.01em}

/* ═══════════════ TOPBAR ═══════════════ */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;
  gap:1rem;padding:.85rem clamp(1rem,4vw,2.6rem);
  background:rgba(7,8,10,.78);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.9rem;min-width:0}
.brand-logo{height:30px;width:auto;max-width:190px;object-fit:contain;display:block}
.brand-rule{width:1px;height:22px;background:var(--line2)}
.brand-tag{font-family:var(--mno);font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.topbar-actions{display:flex;gap:.5rem}

/* ═══════════════ LAYOUT ═══════════════ */
.view{position:relative;z-index:1;padding:clamp(1.4rem,4vw,3.2rem) clamp(1rem,4vw,2.6rem) 5rem;
  max-width:1180px;margin-inline:auto;animation:up .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
#viewDash{max-width:1480px}
.hero{margin-bottom:2.2rem;display:grid;gap:.9rem}
.stack{display:grid;gap:1.1rem}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.grid-2.align-start{align-items:start}
.span-2{grid-column:span 2}

/* ═══════════════ CARD ═══════════════ */
.card{background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);
  border-radius:var(--r);padding:clamp(1.1rem,2.4vw,1.7rem);box-shadow:var(--sh);position:relative}
fieldset.card{border:1px solid var(--line)}
.card-h{font-family:var(--dsp);font-size:.9rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--silver);margin-bottom:1rem;font-weight:600}
.card-h small,.lbl small{color:var(--dim);font-weight:400;letter-spacing:.02em;text-transform:none}
.card-note{color:var(--dim);font-size:.86rem;margin-bottom:1.1rem;max-width:70ch}
.card-note b{color:var(--silver2);font-weight:600}
.step{font-family:var(--dsp);font-size:.86rem;letter-spacing:.13em;text-transform:uppercase;
  color:var(--silver);display:flex;align-items:center;gap:.7rem;padding:0 0 1.1rem;font-weight:600}
.step-n{font-family:var(--mno);font-size:.72rem;color:var(--blue2);border:1px solid var(--line2);
  border-radius:6px;padding:.2rem .45rem;letter-spacing:.06em;background:rgba(47,111,235,.08)}

/* ═══════════════ CAMPOS ═══════════════ */
.field{display:grid;gap:.42rem;min-width:0}
.lbl{font-size:.74rem;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);font-weight:600}
input,select,textarea{width:100%;font-family:var(--bdy);font-size:.95rem;color:var(--silver);
  background:var(--ink2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:.72rem .85rem;transition:border-color .16s,box-shadow .16s,background .16s}
input.mono{font-family:var(--mno)}
textarea{resize:vertical;min-height:96px;line-height:1.55}
input::placeholder,textarea::placeholder{color:#565E69}
input:hover,select:hover,textarea:hover{border-color:var(--line2)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);background:#0F1319;
  box-shadow:0 0 0 3px var(--blueGlow)}
input[type=date]{font-family:var(--mno);font-size:.85rem}
select{appearance:none;cursor:pointer;padding-right:2.2rem}
select option{background:#12151A;color:var(--silver)}
.select-wrap{position:relative}
.select-wrap i{position:absolute;right:.85rem;top:50%;transform:translateY(-50%);
  color:var(--dim);font-size:.7rem;pointer-events:none}
.hint{font-size:.76rem;color:var(--dim);font-style:normal;min-height:1.05em}
.field.is-bad input,.field.is-bad select,.field.is-bad textarea{border-color:var(--nao);box-shadow:0 0 0 3px rgba(196,87,79,.16)}
.field.is-bad .hint,.hint.is-bad{color:#E08F88}
.pw{position:relative}
.pw input{padding-right:2.6rem}
.pw-eye{position:absolute;right:.4rem;top:50%;transform:translateY(-50%);background:none;border:0;
  color:var(--dim);cursor:pointer;padding:.5rem;font-size:.85rem}
.pw-eye:hover{color:var(--silver)}

/* ═══════════════ BOTÕES ═══════════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;cursor:pointer;
  font-family:var(--bdy);font-size:.85rem;font-weight:600;letter-spacing:.02em;
  padding:.6rem .95rem;border-radius:var(--r-sm);border:1px solid transparent;
  transition:transform .12s,background .16s,border-color .16s,box-shadow .16s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn i{font-size:.85em}
.btn-primary{background:linear-gradient(180deg,var(--blue2),var(--blue));color:#fff;
  border-color:rgba(255,255,255,.14);box-shadow:0 8px 22px -10px var(--blueGlow)}
.btn-primary:hover{box-shadow:0 12px 28px -10px rgba(47,111,235,.55)}
.btn-primary:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}
.btn-line{background:var(--glass2);color:var(--silver);border-color:var(--line)}
.btn-line:hover{border-color:var(--line2);background:#1A1F26}
.btn-ghost{background:transparent;color:var(--silver2);border-color:var(--line)}
.btn-ghost:hover{color:#fff;border-color:var(--line2);background:rgba(255,255,255,.035)}
.btn-lg{padding:.85rem 1.6rem;font-size:.92rem}
.btn.full{width:100%}
.icon-btn{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:7px;cursor:pointer;
  background:transparent;border:1px solid var(--line);color:var(--silver2);font-size:.78rem;transition:.15s}
.icon-btn:hover{color:#fff;border-color:var(--line2);background:rgba(255,255,255,.05)}
.icon-btn.danger:hover{color:#F0A19A;border-color:rgba(196,87,79,.5);background:rgba(196,87,79,.12)}

/* ═══════════════ ASSINATURA: grade de meses ranqueável ═══════════════ */
.months{display:grid;grid-template-columns:repeat(4,1fr);gap:.55rem}
.month{position:relative;cursor:pointer;text-align:left;
  background:var(--ink2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:.7rem .8rem;color:var(--silver2);font-family:var(--dsp);font-weight:600;
  font-size:.82rem;letter-spacing:.07em;text-transform:uppercase;
  transition:border-color .16s,background .16s,color .16s,transform .12s}
.month:hover{border-color:var(--line2);color:#fff;transform:translateY(-1px)}
.month .m-num{display:block;font-family:var(--mno);font-size:.6rem;letter-spacing:.14em;color:var(--dim);margin-bottom:.2rem}
.month[data-rank]{color:#fff;border-color:var(--blue);background:linear-gradient(180deg,rgba(47,111,235,.20),rgba(47,111,235,.07))}
.month[data-rank] .m-num{color:var(--blue2)}
.month[data-rank]::after{content:attr(data-rank)"ª";position:absolute;top:-8px;right:-8px;
  width:26px;height:26px;display:grid;place-items:center;border-radius:50%;
  background:linear-gradient(180deg,var(--blue2),var(--blue));color:#fff;
  font-family:var(--mno);font-size:.62rem;font-weight:500;
  box-shadow:0 0 0 3px var(--ink),0 6px 14px -6px var(--blueGlow);animation:pop .28s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.month.is-full{opacity:.42;cursor:not-allowed}
.month.is-full:hover{transform:none;color:var(--silver2);border-color:var(--line)}

.ranking{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem;margin-top:1rem}
.rank-slot{display:flex;align-items:center;gap:.6rem;background:var(--ink3);border:1px dashed var(--line2);
  border-radius:var(--r-sm);padding:.65rem .8rem;min-width:0}
.rank-slot.is-set{border-style:solid;border-color:var(--line2);background:#151A20}
.rank-n{font-family:var(--mno);font-size:.68rem;color:var(--blue2);letter-spacing:.08em}
.rank-v{font-family:var(--dsp);font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  font-size:.84rem;color:var(--silver);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ═══════════════ CANVAS DE ASSINATURA ═══════════════ */
.sign{position:relative;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line2);
  background:linear-gradient(180deg,#F2F4F7,#DFE3E9);height:190px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.sign canvas{position:relative;z-index:2;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.sign-line{position:absolute;left:8%;right:8%;bottom:38px;height:1px;background:#B7BEC8;z-index:1}
.sign-ph{position:absolute;inset:auto 0 12px;text-align:center;z-index:1;pointer-events:none;
  font-size:.76rem;color:#8A929D;letter-spacing:.04em}
.sign.is-drawn .sign-ph{display:none}
.sign-actions{display:flex;justify-content:flex-end;margin-top:.55rem}

.submit-bar{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;
  padding:1.1rem clamp(1.1rem,2.4vw,1.7rem);background:var(--glass);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--sh)}
.submit-note{color:var(--dim);font-size:.82rem}

/* ═══════════════ CONFIRMAÇÃO ═══════════════ */
.confirm{max-width:660px;margin-inline:auto;text-align:center;display:grid;gap:1rem;justify-items:center;
  padding:clamp(1.8rem,5vw,3rem)}
.confirm-mark{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;color:#fff;
  background:linear-gradient(180deg,#3FBF80,#25845A);box-shadow:0 0 0 8px rgba(51,169,110,.12),0 14px 30px -12px rgba(51,169,110,.6);
  animation:pop .45s cubic-bezier(.2,1.5,.4,1) both}
.confirm-proto{font-family:var(--mno);font-size:.8rem;color:var(--dim);letter-spacing:.06em}
.confirm-proto b{color:var(--blue2);font-weight:500}
.confirm-thanks{font-family:var(--dsp);letter-spacing:.11em;text-transform:uppercase;font-size:.82rem;color:var(--silver2)}
.confirm .ranking{width:100%}

/* ═══════════════ LOGIN ═══════════════ */
.login{max-width:400px;margin:clamp(1rem,6vh,4rem) auto 0;display:grid;gap:1rem;justify-items:stretch;text-align:center}
.login .field{text-align:left}
.login-icon{font-size:1.6rem;color:var(--blue2);justify-self:center}

/* ═══════════════ DASHBOARD ═══════════════ */
.dash{display:grid;grid-template-columns:236px 1fr;gap:1.2rem;align-items:start}
.side{position:sticky;top:74px;background:var(--glass);border:1px solid var(--line);border-radius:var(--r);
  padding:.9rem;display:grid;gap:1.2rem;box-shadow:var(--sh)}
.side-nav{display:grid;gap:.25rem}
.side-item{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;cursor:pointer;
  background:transparent;border:0;border-radius:var(--r-sm);padding:.65rem .75rem;
  color:var(--silver2);font-family:var(--bdy);font-size:.88rem;font-weight:500;transition:.15s}
.side-item i{width:16px;text-align:center;font-size:.85rem;color:var(--dim)}
.side-item:hover{background:rgba(255,255,255,.04);color:#fff}
.side-item.is-active{background:linear-gradient(90deg,rgba(47,111,235,.20),transparent);color:#fff;
  box-shadow:inset 2px 0 0 var(--blue)}
.side-item.is-active i{color:var(--blue2)}
.side-foot{display:grid;gap:.6rem;padding-top:.9rem;border-top:1px solid var(--line)}
.side-meta{font-family:var(--mno);font-size:.68rem;color:var(--dim);letter-spacing:.05em}
.dash-main{display:grid;gap:1.1rem;min-width:0}
.dash-head{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.dash-head .display{margin-top:.3rem}
.dash-export{display:flex;gap:.45rem;flex-wrap:wrap}

.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:.7rem}
.kpi{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:.95rem 1rem;
  display:grid;gap:.3rem;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--line2)}
.kpi.is-pend::before{background:var(--pend)} .kpi.is-analise::before{background:var(--anal)}
.kpi.is-ok::before{background:var(--apro)} .kpi.is-no::before{background:var(--nao)}
.kpi-lbl{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600}
.kpi-v{font-family:var(--dsp);font-size:1.85rem;font-weight:700;line-height:1;color:#fff}

.panel{display:none;animation:up .3s ease both}
.panel.is-active{display:block}
.panel .grid-2{gap:1rem}

.bars{display:grid;gap:.6rem}
.bar{display:grid;grid-template-columns:1fr auto;gap:.3rem .8rem;align-items:center}
.bar-k{font-size:.85rem;color:var(--silver2)}
.bar-v{font-family:var(--mno);font-size:.8rem;color:var(--silver)}
.bar-t{grid-column:1/-1;height:5px;border-radius:99px;background:var(--ink3);overflow:hidden}
.bar-f{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--blue2));
  transition:width .6s cubic-bezier(.2,.8,.2,1)}
.chart-box{position:relative;height:260px}

.toolbar{display:flex;gap:.6rem;margin-bottom:1rem;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:230px}
.search>i{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);color:var(--dim);font-size:.8rem}
.search input{padding-left:2.3rem;padding-right:2.3rem}
.search-x{position:absolute;right:.35rem;top:50%;transform:translateY(-50%);background:none;border:0;
  color:var(--dim);cursor:pointer;padding:.5rem}
.search-x:hover{color:var(--silver)}
.badge{font-family:var(--mno);font-size:.62rem;background:var(--blue);color:#fff;border-radius:99px;padding:.1rem .38rem}
.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem;padding:1rem;margin-bottom:1rem;
  background:var(--ink2);border:1px solid var(--line);border-radius:var(--r-sm);animation:up .25s ease both}
.filters-foot{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:.6rem;
  padding-top:.5rem;border-top:1px solid var(--line);flex-wrap:wrap}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm)}
.tbl{width:100%;border-collapse:collapse;font-size:.86rem;min-width:920px}
.tbl thead th{position:sticky;top:0;z-index:2;background:#101318;text-align:left;
  font-family:var(--mno);font-size:.66rem;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);
  font-weight:500;padding:.7rem .8rem;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
.tbl thead th:hover{color:var(--silver)}
.tbl thead th.th-acoes{cursor:default;text-align:right}
.tbl thead th[data-dir]::after{content:"↑";margin-left:.35rem;color:var(--blue2)}
.tbl thead th[data-dir=desc]::after{content:"↓"}
.tbl tbody td{padding:.68rem .8rem;border-bottom:1px solid rgba(37,43,52,.6);color:var(--silver2);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:rgba(255,255,255,.028);color:var(--silver)}
.tbl .c-nome{color:#fff;font-weight:500;white-space:nowrap}
.tbl .c-mono{font-family:var(--mno);font-size:.79rem;white-space:nowrap}
.tbl .c-acoes{text-align:right;white-space:nowrap}
.tbl .c-acoes .icon-btn{margin-left:.25rem}
.pill{display:inline-flex;align-items:center;gap:.4rem;font-size:.72rem;font-weight:600;letter-spacing:.04em;
  padding:.24rem .6rem;border-radius:99px;border:1px solid;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.s-pend{color:var(--pend);border-color:rgba(203,163,58,.4);background:rgba(203,163,58,.1)}
.pill.s-anal{color:var(--anal);border-color:rgba(92,142,246,.4);background:rgba(92,142,246,.1)}
.pill.s-apro{color:var(--apro);border-color:rgba(51,169,110,.4);background:rgba(51,169,110,.1)}
.pill.s-nao{color:var(--nao);border-color:rgba(196,87,79,.4);background:rgba(196,87,79,.1)}
.empty{display:grid;gap:.7rem;place-items:center;padding:3rem 1rem;color:var(--dim);text-align:center}
.empty i{font-size:1.7rem;opacity:.6}

.highlights{display:grid;grid-template-columns:repeat(2,1fr);gap:.9rem}
.hl{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:1.3rem;display:grid;gap:.4rem}
.hl-lbl{font-size:.7rem;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);font-weight:600}
.hl-v{font-family:var(--dsp);font-size:1.45rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#fff;line-height:1.1}
.hl-sub{font-family:var(--mno);font-size:.74rem;color:var(--blue2)}

/* ═══════════════ MODAL ═══════════════ */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:1rem}
.modal-bg{position:absolute;inset:0;background:rgba(4,5,7,.76);backdrop-filter:blur(6px);animation:fade .2s ease both}
@keyframes fade{from{opacity:0}}
.modal-box{position:relative;width:min(760px,100%);max-height:88vh;overflow:auto;
  background:#101318;border:1px solid var(--line2);border-radius:var(--r);box-shadow:0 40px 80px -30px #000;
  animation:up .3s cubic-bezier(.2,.8,.2,1) both}
.modal-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:1.1rem 1.3rem;background:#101318;border-bottom:1px solid var(--line)}
.modal-x{background:none;border:0;color:var(--dim);font-size:1rem;cursor:pointer;padding:.3rem}
.modal-x:hover{color:#fff}
.modal-body{padding:1.3rem;display:grid;gap:1.1rem}
.modal-foot{padding:1rem 1.3rem;border-top:1px solid var(--line);display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}
.dl{display:grid;grid-template-columns:170px 1fr;gap:.55rem 1rem}
.dl dt{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600;padding-top:.15rem}
.dl dd{color:var(--silver);font-size:.92rem;word-break:break-word}
.sign-view{background:#F2F4F7;border-radius:var(--r-sm);padding:.6rem;display:grid;place-items:center;min-height:120px}
.sign-view img{max-width:100%;height:auto;display:block}

/* ═══════════════ TOASTS / LOADER ═══════════════ */
.toasts{position:fixed;bottom:1.2rem;right:1.2rem;z-index:80;display:grid;gap:.55rem;max-width:min(380px,92vw)}
.toast{display:flex;align-items:flex-start;gap:.7rem;padding:.8rem 1rem;border-radius:var(--r-sm);
  background:#141821;border:1px solid var(--line2);box-shadow:0 20px 40px -18px #000;font-size:.86rem;
  animation:slide .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes slide{from{opacity:0;transform:translateX(24px)}}
.toast.out{animation:slideOut .25s ease both}
@keyframes slideOut{to{opacity:0;transform:translateX(24px)}}
.toast i{margin-top:.15rem}
.toast.ok{border-left:3px solid var(--apro)} .toast.ok i{color:var(--apro)}
.toast.err{border-left:3px solid var(--nao)} .toast.err i{color:var(--nao)}
.toast.info{border-left:3px solid var(--blue)} .toast.info i{color:var(--blue2)}
.loader{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(5,6,9,.72);backdrop-filter:blur(5px)}
.loader-box{display:grid;gap:.9rem;place-items:center;color:var(--silver2);font-size:.88rem}
.spin{width:38px;height:38px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--blue2);
  animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
